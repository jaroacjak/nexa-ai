<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d12;
      --sidebar: #10131a;
      --surface: #171a22;
      --surface-hover: #1d212b;
      --border: #292e39;
      --text: #f5f7fa;
      --muted: #9ba3b2;
      --accent: #8b7cff;
      --accent-2: #5e9cff;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      transition: 0.25s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      font-weight: 800;
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      transition: 0.2s;
    }

    .new-chat:hover {
      background: var(--surface-hover);
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin: 28px 8px 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 9px;
      color: #cbd0da;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      background: var(--surface-hover);
    }

    .profile {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #252a35;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .profile-name {
      font-size: 14px;
    }

    .profile-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    /* MAIN */

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .model {
      font-size: 15px;
      font-weight: 600;
    }

    .model span {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
    }

    .menu-btn {
      display: none;
      border: 0;
      background: transparent;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 160px;
    }

    .welcome {
      max-width: 820px;
      margin: 100px auto 0;
    }

    .welcome h1 {
      font-size: 42px;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .gradient-text {
      background: linear-gradient(90deg, #9b8cff, #66a7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: var(--muted);
      font-size: 17px;
    }

    .messages {
      max-width: 820px;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 14px;
      margin: 26px 0;
      line-height: 1.65;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .user .message-avatar {
      background: #303642;
    }

    .ai .message-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .message-content {
      padding-top: 4px;
      white-space: pre-wrap;
    }

    /* INPUT */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 20px;
      background: linear-gradient(
        transparent,
        var(--bg) 35%
      );
    }

    .input-wrapper {
      max-width: 820px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 15px;
      padding: 9px 10px;
      min-height: 40px;
      max-height: 150px;
    }

    textarea::placeholder {
      color: #737b89;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .hint {
      text-align: center;
      color: #606876;
      font-size: 11px;
      margin-top: 9px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -270px;
        top: 0;
        bottom: 0;
      }

      .sidebar.open {
        left: 0;
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        padding: 0 16px;
      }

      .input-area {
        left: 0;
        padding: 12px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .chat {
        padding-left: 15px;
        padding-right: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <div class="logo">
        <div class="logo-icon">N</div>
        Nexa AI
      </div>

      <button class="new-chat" onclick="newChat()">
        ＋ &nbsp; Nový chat
      </button>

      <div class="history-title">
        História
      </div>

      <div class="history" id="history"></div>

      <div class="profile">
        <div class="avatar">U</div>
        <div>
          <div class="profile-name">Používateľ</div>
          <div class="profile-status">Nexa AI</div>
        </div>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>

        <div class="model">
          Nexa AI
          <span>Assistant</span>
        </div>

        <div></div>
      </header>

      <section class="chat" id="chat">

        <div class="welcome" id="welcome">
          <h1>
            Ahoj, som <span class="gradient-text">Nexa AI</span>.
          </h1>

          <p>
            Ako ti dnes môžem pomôcť?
          </p>
        </div>

        <div class="messages" id="messages"></div>

      </section>

    </main>

    <!-- INPUT -->
    <div class="input-area">

      <div class="input-wrapper">

        <textarea
          id="input"
          rows="1"
          placeholder="Napíš správu pre Nexa AI..."
          onkeydown="handleKey(event)"
        ></textarea>

        <button class="send-btn" onclick="sendMessage()">
          ↑
        </button>

      </div>

      <div class="hint">
        Nexa AI môže robiť chyby. Skontroluj dôležité informácie.
      </div>

    </div>

  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const history = document.getElementById("history");

    function handleKey(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      welcome.style.display = "none";

      addMessage(text, "user");

      input.value = "";
      input.style.height = "auto";

      // Dočasná odpoveď — neskôr napojíme skutočnú AI.
      setTimeout(() => {
        addMessage(
          "Ahoj! Som Nexa AI. Toto je zatiaľ testovacia odpoveď. Neskôr ma môžeme napojiť na skutočný AI model.",
          "ai"
        );
      }, 500);
    }

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = `message ${type}`;

      const avatar = document.createElement("div");
      avatar.className = "message-avatar";
      avatar.textContent = type === "user" ? "U" : "N";

      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = text;

      message.appendChild(avatar);
      message.appendChild(content);

      messages.appendChild(message);

      document.getElementById("chat").scrollTo({
        top: document.getElementById("chat").scrollHeight,
        behavior: "smooth"
      });

      if (type === "user") {
        addHistory(text);
      }
    }

    function addHistory(text) {
      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = text;

      history.prepend(item);
    }

    function newChat() {
      messages.innerHTML = "";
      welcome.style.display = "block";
      input.value = "";
      input.focus();
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });
  </script>

</body>
</html>
