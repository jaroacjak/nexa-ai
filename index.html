<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexa AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d12;
      --sidebar: #10131a;
      --surface: #171a22;
      --surface-hover: #20242e;
      --border: #2a2f3a;
      --text: #f5f7fa;
      --muted: #969eac;
      --accent: #8b7cff;
      --accent2: #5e9cff;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    button {
      font-family: inherit;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* ================= SIDEBAR ================= */

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 18px;
      display: flex;
      flex-direction: column;
      transition: .25s ease;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      font-weight: 800;
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 13px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      transition: .2s;
    }

    .new-chat:hover {
      background: var(--surface-hover);
    }

    .history-title {
      color: var(--muted);
      font-size: 11px;
      margin: 27px 8px 10px;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .history {
      overflow-y: auto;
      flex: 1;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 9px;
      color: #cbd0da;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item:hover,
    .history-item.active {
      background: var(--surface-hover);
    }

    .profile {
      border-top: 1px solid var(--border);
      padding-top: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #292e38;
      display: grid;
      place-items: center;
    }

    .profile-name {
      font-size: 14px;
    }

    .profile-status {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    /* ================= MAIN ================= */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
    }

    .model {
      font-size: 15px;
      font-weight: 600;
    }

    .model span {
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
    }

    .menu-btn {
      display: none;
      background: none;
      border: 0;
      color: white;
      font-size: 23px;
      cursor: pointer;
    }

    /* ================= CHAT ================= */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 180px;
    }

    .welcome {
      max-width: 820px;
      margin: 100px auto 0;
    }

    .welcome h1 {
      font-size: 42px;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .gradient {
      background: linear-gradient(90deg, #a091ff, #67a7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: var(--muted);
      font-size: 17px;
    }

    .messages {
      max-width: 820px;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 14px;
      margin: 26px 0;
      line-height: 1.65;
    }

    .message-avatar {
      width: 35px;
      height: 35px;
      min-width: 35px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 700;
    }

    .user .message-avatar {
      background: #303641;
    }

    .ai .message-avatar {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }

    .message-content {
      padding-top: 4px;
      white-space: pre-wrap;
      min-width: 0;
    }

    .message-tools {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }

    .message-tools button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .message-tools button:hover {
      background: var(--surface-hover);
      color: white;
    }

    /* ================= ATTACHMENTS ================= */

    .attachment-preview {
      max-width: 820px;
      margin: 0 auto 8px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }

    .attachment {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .attachment button {
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
    }

    /* ================= INPUT ================= */

    .input-area {
      position: fixed;
      bottom: 0;
      left: 270px;
      right: 0;
      padding: 18px 20px 20px;
      background: linear-gradient(transparent, var(--bg) 35%);
    }

    .input-wrapper {
      max-width: 820px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 9px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      box-shadow: 0 10px 35px rgba(0,0,0,.25);
    }

    .tool-btn {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      color: #aeb5c2;
      border-radius: 10px;
      cursor: pointer;
      font-size: 19px;
      flex-shrink: 0;
      transition: .2s;
    }

    .tool-btn:hover {
      background: var(--surface-hover);
      color: white;
    }

    .tool-btn.active {
      color: #ff6b6b;
      background: rgba(239,83,80,.12);
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-family: inherit;
      font-size: 15px;
      padding: 9px 7px;
      min-height: 40px;
      max-height: 150px;
    }

    textarea::placeholder {
      color: #737b89;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      cursor: pointer;
      font-size: 19px;
      flex-shrink: 0;
      transition: .2s;
    }

    .send-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    .hint {
      text-align: center;
      color: #606876;
      font-size: 11px;
      margin-top: 8px;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(7px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(600px, 100%);
      background: #151820;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      font-size: 17px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      cursor: pointer;
    }

    video {
      width: 100%;
      border-radius: 13px;
      background: black;
      display: block;
      max-height: 60vh;
      object-fit: contain;
    }

    /* ================= TOAST ================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 95px;
      transform: translateX(-50%) translateY(15px);
      background: #222630;
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ================= MOBILE ================= */

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        left: -270px;
        top: 0;
        bottom: 0;
      }

      .sidebar.open {
        left: 0;
      }

      .menu-btn {
        display: block;
      }

      .topbar {
        padding: 0 15px;
      }

      .input-area {
        left: 0;
        padding: 12px;
      }

      .welcome {
        margin-top: 70px;
      }

      .welcome h1 {
        font-size: 32px;
      }

      .chat {
        padding-left: 15px;
        padding-right: 15px;
      }

      .tool-btn {
        width: 36px;
        height: 36px;
      }

      .send-btn {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-icon">N</div>
      Nexa AI
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ &nbsp; Nový chat
    </button>

    <div class="history-title">História</div>

    <div class="history" id="history"></div>

    <div class="profile">
      <div class="avatar">U</div>

      <div>
        <div class="profile-name">Používateľ</div>
        <div class="profile-status">Nexa AI</div>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">

      <button class="menu-btn" onclick="toggleSidebar()">
        ☰
      </button>

      <div class="model">
        Nexa AI
        <span>Assistant</span>
      </div>

      <div></div>

    </header>

    <section class="chat" id="chat">

      <div class="welcome" id="welcome">

        <h1>
          Ahoj, som
          <span class="gradient">Nexa AI</span>.
        </h1>

        <p>
          Ako ti dnes môžem pomôcť?
        </p>

      </div>

      <div class="messages" id="messages"></div>

    </section>

  </main>

  <!-- INPUT -->

  <div class="input-area">

    <div
      class="attachment-preview"
      id="attachmentPreview">
    </div>

    <div class="input-wrapper">

      <!-- FILE -->

      <button
        class="tool-btn"
        title="Pridať prílohu"
        onclick="document.getElementById('fileInput').click()">
        📎
      </button>

      <input
        id="fileInput"
        type="file"
        multiple
        hidden
        onchange="handleFiles(event)"
      >

      <!-- CAMERA -->

      <button
        class="tool-btn"
        title="Kamera"
        onclick="openCamera()">
        📷
      </button>

      <!-- SCREEN -->

      <button
        class="tool-btn"
        title="Zdieľať obrazovku"
        onclick="shareScreen()">
        🖥️
      </button>

      <!-- MICROPHONE -->

      <button
        class="tool-btn"
        id="micButton"
        title="Mikrofón"
        onclick="prepareMicrophone()">
        🎤
      </button>

      <!-- TEXT -->

      <textarea
        id="input"
        rows="1"
        placeholder="Napíš správu pre Nexa AI..."
        onkeydown="handleKey(event)">
      </textarea>

      <!-- SEND -->

      <button
        class="send-btn"
        onclick="sendMessage()"
        title="Odoslať">
        ↑
      </button>

    </div>

    <div class="hint">
      Nexa AI môže robiť chyby. Skontroluj dôležité informácie.
    </div>

  </div>

</div>


<!-- MEDIA MODAL -->

<div class="modal" id="mediaModal">

  <div class="modal-box">

    <div class="modal-header">

      <h2 id="mediaTitle">
        Nexa AI kamera
      </h2>

      <button
        class="close-btn"
        onclick="closeMedia()">
        ×
      </button>

    </div>

    <video
      id="mediaVideo"
      autoplay
      playsinline>
    </video>

  </div>

</div>


<!-- TOAST -->

<div class="toast" id="toast"></div>


<script>

  /* ================= STATE ================= */

  const input =
    document.getElementById("input");

  const messages =
    document.getElementById("messages");

  const welcome =
    document.getElementById("welcome");

  const history =
    document.getElementById("history");

  const attachmentPreview =
    document.getElementById("attachmentPreview");

  const mediaModal =
    document.getElementById("mediaModal");

  const mediaVideo =
    document.getElementById("mediaVideo");

  let selectedFiles = [];

  let currentStream = null;

  let currentChat = null;

  let chatId = 0;

  let chats = [];


  /* ================= CHAT ================= */

  function createChat() {

    chatId++;

    currentChat = {
      id: chatId,
      title: "Nový chat",
      messages: []
    };

    chats.push(currentChat);

    updateHistory();

    return currentChat;
  }


  function newChat() {

    /*
      Aktuálny chat sa NEVYTVÁRA pri každej správe.
      Nový chat vznikne iba po kliknutí na toto tlačidlo.
    */

    if (
      currentChat &&
      currentChat.messages.length === 0
    ) {
      return;
    }

    createChat();

    messages.innerHTML = "";

    welcome.style.display = "block";

    input.value = "";

    selectedFiles = [];

    attachmentPreview.innerHTML = "";

    attachmentPreview.style.display = "none";

    input.focus();
  }


  function loadChat(id) {

    const chat =
      chats.find(item => item.id === id);

    if (!chat) return;

    currentChat = chat;

    messages.innerHTML = "";

    if (chat.messages.length === 0) {

      welcome.style.display = "block";

    } else {

      welcome.style.display = "none";

      chat.messages.forEach(message => {

        if (message.type === "ai") {

          renderAIMessage(
            message.text,
            false
          );

        } else {

          renderUserMessage(
            message.text,
            false
          );
        }

      });
    }

    updateHistory();
  }


  /* ================= SEND ================= */

  function sendMessage() {

    const text =
      input.value.trim();

    if (
      !text &&
      selectedFiles.length === 0
    ) {
      return;
    }

    /*
      Ak používateľ začne písať bez toho,
      aby vytvoril chat, vytvoríme iba jeden
      aktuálny chat.
    */

    if (!currentChat) {
      createChat();
    }

    welcome.style.display = "none";

    let messageText = text;

    if (selectedFiles.length > 0) {

      const names =
        selectedFiles
          .map(file => file.name)
          .join(", ");

      messageText +=
        (messageText ? "\n\n" : "") +
        "📎 Prílohy: " +
        names;
    }

    currentChat.messages.push({
      type: "user",
      text: messageText
    });

    if (
      currentChat.title === "Nový chat"
    ) {

      currentChat.title =
        text ||
        selectedFiles[0]?.name ||
        "Nový chat";
    }

    renderUserMessage(
      messageText,
      true
    );

    updateHistory();

    input.value = "";

    input.style.height = "auto";

    selectedFiles = [];

    attachmentPreview.innerHTML = "";

    attachmentPreview.style.display = "none";


    /*
      TESTOVACIA AI ODPOVEĎ
    */

    setTimeout(() => {

      const response =
        "Ahoj! Som Nexa AI. Toto je zatiaľ testovacia odpoveď. Neskôr môžeme Nexa AI napojiť na skutočný AI model.";

      currentChat.messages.push({
        type: "ai",
        text: response
      });

      renderAIMessage(
        response,
        true
      );

    }, 600);
  }


  /* ================= RENDER USER ================= */

  function renderUserMessage(
    text,
    scroll = true
  ) {

    const message =
      document.createElement("div");

    message.className =
      "message user";

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.textContent = "U";

    const content =
      document.createElement("div");

    content.className =
      "message-content";

    content.textContent = text;

    message.appendChild(avatar);

    message.appendChild(content);

    messages.appendChild(message);

    if (scroll) {
      scrollChat();
    }
  }


  /* ================= RENDER AI ================= */

  function renderAIMessage(
    text,
    scroll = true
  ) {

    const message =
      document.createElement("div");

    message.className =
      "message ai";

    const avatar =
      document.createElement("div");

    avatar.className =
      "message-avatar";

    avatar.textContent = "N";

    const container =
      document.createElement("div");

    const content =
      document.createElement("div");

    content.className =
      "message-content";

    content.textContent = text;

    const tools =
      document.createElement("div");

    tools.className =
      "message-tools";

    const speak =
      document.createElement("button");

    speak.textContent =
      "🔊 Prečítať";

    speak.onclick = () => {
      speakText(text);
    };

    tools.appendChild(speak);

    container.appendChild(content);

    container.appendChild(tools);

    message.appendChild(avatar);

    message.appendChild(container);

    messages.appendChild(message);

    if (scroll) {
      scrollChat();
    }
  }


  /* ================= HISTORY ================= */

  function updateHistory() {

    history.innerHTML = "";

    chats
      .slice()
      .reverse()
      .forEach(chat => {

        const item =
          document.createElement("div");

        item.className =
          "history-item" +
          (
            currentChat &&
            currentChat.id === chat.id
              ? " active"
              : ""
          );

        item.textContent =
          chat.title;

        item.onclick = () => {
          loadChat(chat.id);
        };

        history.appendChild(item);
      });
  }


  /* ================= SCROLL ================= */

  function scrollChat() {

    const chat =
      document.getElementById("chat");

    chat.scrollTo({
      top: chat.scrollHeight,
      behavior: "smooth"
    });
  }


   /* ================= FILES ================= */

  function handleFiles(event) {

    const files =
      Array.from(event.target.files);

    selectedFiles = [
      ...selectedFiles,
      ...files
    ];

    renderAttachments();

    event.target.value = "";
  }


  function renderAttachments() {

    attachmentPreview.innerHTML = "";

    if (
      selectedFiles.length === 0
    ) {

      attachmentPreview.style.display =
        "none";

      return;
    }

    attachmentPreview.style.display =
      "flex";

    selectedFiles.forEach(
      (file, index) => {

        const item =
          document.createElement("div");

        item.className =
          "attachment";

        item.innerHTML =
          "📎 " +
          escapeHTML(file.name) +
          ` <button onclick="removeFile(${index})">×</button>`;

        attachmentPreview.appendChild(item);
      }
    );
  }


  function removeFile(index) {

    selectedFiles.splice(index, 1);

    renderAttachments();
  }


  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ================= MICROPHONE ================= */

  function prepareMicrophone() {

    showToast(
      "🎤 Mikrofón sa pripravuje..."
    );

    const button =
      document.getElementById(
        "micButton"
      );

    button.classList.add("active");

    setTimeout(() => {

      button.classList.remove("active");

      showToast(
        "🎤 Hlasové ovládanie Nexa AI sa pripravuje."
      );

    }, 1800);
  }


  /* ================= SPEECH ================= */

  function speakText(text) {

    if (
      !("speechSynthesis" in window)
    ) {

      showToast(
        "Tento prehliadač nepodporuje hlasové čítanie."
      );

      return;
    }

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(text);

    speech.lang = "sk-SK";

    speech.rate = 1;

    speech.pitch = 1;

    window.speechSynthesis.speak(
      speech
    );
  }


  /* ================= CAMERA ================= */

  async function openCamera() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      showToast(
        "Kamera nie je v tomto prehliadači dostupná."
      );

      return;
    }

    try {

      currentStream =
        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

      mediaVideo.srcObject =
        currentStream;

      document.getElementById(
        "mediaTitle"
      ).textContent =
        "📷 Nexa AI kamera";

      mediaModal.classList.add("show");

    } catch (error) {

      showToast(
        "Prístup ku kamere bol zamietnutý alebo nie je dostupný."
      );
    }
  }


  /* ================= SCREEN ================= */

  async function shareScreen() {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getDisplayMedia
    ) {

      showToast(
        "Zdieľanie obrazovky nie je podporované."
      );

      return;
    }

    try {

      currentStream =
        await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

      mediaVideo.srcObject =
        currentStream;

      document.getElementById(
        "mediaTitle"
      ).textContent =
        "🖥️ Zdieľanie obrazovky";

      mediaModal.classList.add("show");

      currentStream
        .getVideoTracks()[0]
        .addEventListener(
          "ended",
          () => {
            closeMedia();
          }
        );

    } catch (error) {

      showToast(
        "Zdieľanie obrazovky bolo zrušené."
      );
    }
  }


  function closeMedia() {

    mediaModal.classList.remove(
      "show"
    );

    if (currentStream) {

      currentStream
        .getTracks()
        .forEach(track => {
          track.stop();
        });

      currentStream = null;
    }

    mediaVideo.srcObject = null;
  }


  /* ================= SIDEBAR ================= */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");
  }


  /* ================= TOAST ================= */

  let toastTimer;

  function showToast(text) {

    const toast =
      document.getElementById(
        "toast"
      );

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 2500);
  }


  /* ================= TEXTAREA ================= */

  input.addEventListener(
    "input",
    () => {

      input.style.height = "auto";

      input.style.height =
        Math.min(
          input.scrollHeight,
          150
        ) + "px";
    }
  );


  /* ================= ENTER ================= */

  input.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }
    }
  );


  /* ================= START ================= */

  /*
    Na začiatku nie je vytvorených
    5 prázdnych chatov.

    Prvý chat vznikne až keď používateľ
    začne skutočne písať alebo klikne
    na "Nový chat".
  */

</script>

</body>
